services:
  email-me:
    build: .
    image: ghcr.io/tut1vog/email-me:latest
    restart: unless-stopped
    ports:
      # Localhost only. To let agents on other hosts in, put a TLS reverse
      # proxy or an encrypted tunnel in front of the API (see README).
      - "127.0.0.1:8025:8025"   # agent API
      - "127.0.0.1:8026:8026"   # dashboard — keep this local
    volumes:
      - ./config:/config:ro
      - email-me-data:/data
    secrets:
      - kek
      # - previous_kek            # only while rotating the KEK (README)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# The key-encryption key protects every credential in state.db. Keep it
# outside this directory, e.g. `openssl rand -hex 32 > ~/.config/email-me/kek`,
# and name it in .env or the shell: EMAIL_ME_KEK_FILE=~/.config/email-me/kek.
# Keep a copy: without it the stored credentials are lost. An empty file
# means no KEK (signing off). Secrets of a read-only service must be files.
secrets:
  kek:
    file: ${EMAIL_ME_KEK_FILE:?set EMAIL_ME_KEK_FILE to the key-encryption key file}
  # previous_kek:
  #   file: ${EMAIL_ME_PREVIOUS_KEK_FILE:?set EMAIL_ME_PREVIOUS_KEK_FILE to the old KEK file}

volumes:
  email-me-data:
