# Development stack: email-me delivering to Mailpit instead of a real mailbox.
#   docker compose -f compose.dev.yml up --build
#   dashboard  http://localhost:8026  (password: dev-password-change-me)
#   agent API  http://localhost:8025
#   Mailpit    http://localhost:8027  (see delivered messages)
services:
  email-me:
    build: .
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:8026:8026"
    volumes:
      - ./dev/config:/config:ro
      - ./dev/secrets:/run/secrets:ro
      - email-me-dev-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8027:8025"   # web UI

volumes:
  email-me-dev-data:
