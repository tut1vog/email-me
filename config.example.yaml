# email-me configuration: ~/.config/email-me/config.yaml
#
# `email-me start` writes this file on its first run, next to a fresh
# key-encryption key (kek). The directory is the whole configuration: back
# it up, kek included, since without kek the credentials stored in the
# state database are lost.
#
# The dashboard (`email-me console`) edits everything here except the
# bootstrap keys and saves it back to this file, keeping your comments.
# Bootstrap keys (api.listen, api.tls, dashboard.listen, kek, log) apply when
# email-me starts: edit them here, then run `email-me restart`. Hand edits
# to anything else apply the same way. No secret is written here: the SMTP
# password is entered on the dashboard and stored encrypted. Paths are
# relative to this directory. The file is validated as a whole and every
# problem is reported at once.

api:
  # Host address of the agent API. Keep it local unless TLS or an encrypted
  # tunnel is in front (see the README).
  listen: 127.0.0.1:8025
  # The URL agents use, for the agent guide, e.g. https://email-me.example.ts.net
  public_url: ""
  # Who may read /, /llms.txt and /openapi.json: public or authenticated.
  docs: public
  # CIDRs of reverse proxies whose X-Forwarded-* headers are honored.
  trusted_proxies: []
  # true: agents reach the API over an encrypted tunnel (Tailscale,
  # WireGuard, SSH), which silences the plain-HTTP warnings.
  external_transport_encryption: false
  # Optional built-in TLS for the agent API:
  # tls:
  #   cert_file: tls/cert.pem
  #   key_file: tls/key.pem

dashboard:
  # Host address of the dashboard, open only while `email-me console` runs.
  listen: 127.0.0.1:8026

upstream:
  smtp:
    # The SMTP server mail goes out through, e.g. smtp.gmail.com. The
    # password is entered on the dashboard's Settings page, never here.
    host: ""
    port: 587
    # starttls, tls, or none (none only to localhost).
    security: starttls
    username: ""
    timeout: 30s
  # Envelope and header From address, e.g. you@gmail.com.
  from: ""
  from_name_template: "{agent} via email-me"

kek:
  # The key-encryption key: 32 random bytes as hex. An empty file means none,
  # which stores the SMTP password unencrypted and turns signing off.
  file: kek
  # Only while rotating the KEK; ignored when absent.
  previous_file: previous_kek

signing:
  # Lifetime of newly generated agent signing keys.
  key_validity: 2y

defaults:
  # Applied to every agent unless its own policy overrides a field.
  # services, when omitted: markdown, attachments, thread, and sign with a KEK.
  # require_signing, when omitted: true with a KEK, false without.
  policy:
    # Aliases are best granted per agent.
    recipients: []
    # Decoded body plus attachments.
    max_message_bytes: 10MiB
    max_attachments: 10
    # Empty allows any, e.g. ["text/*", "application/pdf", "image/*"].
    allowed_attachment_types: []
    rate_limit: {per_hour: 20, per_day: 100}
    subject_prefix: "[{agent}] "
    require_encryption: false

audit:
  retention_days: 30
  # true also records subjects (never bodies).
  log_subject: false

log:
  # debug, info, warn or error.
  level: info

# Recipients are the aliases agents address; agents never see the addresses.
# Example:
#   me:
#     address: you@gmail.com
#     description: Personal inbox — general results and reports
#     # Optional: enables encryption (options.encrypt pgp and e2e).
#     pgp_public_key: |
#       -----BEGIN PGP PUBLIC KEY BLOCK-----
#       ...
#     require_encryption: false
recipients: {}

# Agents send through the API with tokens issued on the dashboard, which
# refer to them by name: removing an agent here stops its tokens. Example:
#   nightly-report:
#     description: Nightly build summaries
#     disabled: false
#     # Overrides of defaults.policy.
#     policy:
#       recipients: [me]
agents: {}
